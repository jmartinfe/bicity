[project]
name = "bicity"
version = "0.1.0"
description = "Backend API for a city bike-sharing system: bike access, station docking and trip management."
readme = "README.md"
authors = [
    { name = "Juan Martín", email = "jmartinfe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "types-redis>=4.6.0.20241004",
    "uvicorn>=0.54.0",
]

[project.scripts]
bicity = "bicity:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
